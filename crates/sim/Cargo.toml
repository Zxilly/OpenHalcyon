[package]
name = "halcyon-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
ecs-visibility-bench = ["dep:hecs"]
bevy-visibility-bench = ["ecs-visibility-bench", "dep:bevy_ecs"]

[[example]]
name = "ecs_bench"
required-features = ["ecs-visibility-bench"]

[dependencies]
halcyon-data = { path = "../data" }
bevy_ecs = { version = "=0.20.1", optional = true, default-features = false, features = ["std"] }
hecs = { version = "0.11", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

[lints]
workspace = true
