[package]
name = "halcyon-peer-play"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
halcyon-federation = { path = "../federation" }
halcyon-game = { path = "../game" }
halcyon-matchmaking = { path = "../matchmaking" }
halcyon-platform = { path = "../platform" }
halcyon-types = { path = "../types" }
http = "1"
diesel = { workspace = true, features = ["returning_clauses_for_sqlite_3_35"] }
diesel_migrations.workspace = true
halcyon-storage = { path = "../storage" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] } # independent pre-Diesel file fixture
rcgen = "0.13"
tempfile = "3"

[lints]
workspace = true
