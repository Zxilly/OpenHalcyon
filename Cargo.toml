[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "1.0.0-draft.1"
license = "MIT"
repository = "https://github.com/Zxilly/OpenHalcyon"

[workspace.lints.clippy]
disallowed_macros = "deny"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
bevy_app = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
bonsai-bt = { version = "0.14.0", features = ["serde", "f32"] }
bytes = "1"
diesel = { version = "~2.3.4", default-features = false, features = ["sqlite"] }
diesel_migrations = { version = "2.3", default-features = false, features = ["sqlite"] }
dodgy_2d = "0.5.5"
polyanya = { version = "0.18.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
